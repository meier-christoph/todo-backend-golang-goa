openapi: 3.0.3
info:
    title: Todo
    description: Todo-Backend Implementation with GOLANG & GOA
    version: 0.0.1
servers:
    - url: http://localhost:8080
paths:
    /healthy:
        get:
            tags:
                - probes
            summary: healthy probes
            operationId: probes#healthy
            responses:
                "200":
                    description: OK response.
            security: []
    /todos:
        delete:
            tags:
                - todos
            summary: deleteAll todos
            operationId: todos#deleteAll
            responses:
                "204":
                    description: No Content response.
        get:
            tags:
                - todos
            summary: list todos
            operationId: todos#list
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Todo'
                                example:
                                    - completed: true
                                      id: 7672171696662812378
                                      order: 8457095650093581103
                                      title: Ex et voluptatibus.
                                      url: Perferendis dicta.
                                    - completed: true
                                      id: 7672171696662812378
                                      order: 8457095650093581103
                                      title: Ex et voluptatibus.
                                      url: Perferendis dicta.
                            example:
                                - completed: true
                                  id: 7672171696662812378
                                  order: 8457095650093581103
                                  title: Ex et voluptatibus.
                                  url: Perferendis dicta.
                                - completed: true
                                  id: 7672171696662812378
                                  order: 8457095650093581103
                                  title: Ex et voluptatibus.
                                  url: Perferendis dicta.
        post:
            tags:
                - todos
            summary: create todos
            operationId: todos#create
            requestBody:
                description: Request body for create.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TodoPayload'
                        example:
                            completed: true
                            order: 6090170723161103845
                            title: Blanditiis vitae magni laboriosam.
            responses:
                "201":
                    description: Created response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Todo'
                            example:
                                completed: false
                                id: 4534222015564194139
                                order: 7306961935261350155
                                title: Rerum maxime laborum.
                                url: Culpa fuga perspiciatis.
                "400":
                    description: 'BadRequest: Invalid user input.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: BadRequest
                                temporary: false
                                timeout: false
    /todos/{id}:
        delete:
            tags:
                - todos
            summary: delete todos
            operationId: todos#delete
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    example: Nihil veritatis reiciendis ad.
                  example: Nihil veritatis reiciendis ad.
            responses:
                "204":
                    description: No Content response.
                "404":
                    description: 'NotFound: Todo not found.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: NotFound
                                temporary: false
                                timeout: false
        get:
            tags:
                - todos
            summary: read todos
            operationId: todos#read
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    example: Voluptatem explicabo odit laudantium quos.
                  example: Voluptatem explicabo odit laudantium quos.
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Todo'
                            example:
                                completed: true
                                id: 8812075414571772195
                                order: 3660912481358776047
                                title: Harum nemo voluptatem unde.
                                url: Magni quis nisi doloremque fugit repellendus.
                "404":
                    description: 'NotFound: Todo not found.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: NotFound
                                temporary: false
                                timeout: false
        patch:
            tags:
                - todos
            summary: update todos
            operationId: todos#update
            parameters:
                - name: id
                  in: path
                  required: true
                  schema:
                    type: string
                    example: Cupiditate neque magnam modi fugiat commodi.
                  example: Cupiditate neque magnam modi fugiat commodi.
            requestBody:
                description: Request body for update.
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateRequestBody'
                        example:
                            completed: false
                            order: 2016535712702321141
                            title: Est impedit aut rerum.
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Todo'
                            example:
                                completed: false
                                id: 9164918609239624857
                                order: 7373577068263458537
                                title: Pariatur dolores aut qui perferendis iure.
                                url: Vitae doloremque facilis iusto.
                "400":
                    description: 'BadRequest: Invalid user input.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: BadRequest
                                temporary: false
                                timeout: false
                "404":
                    description: 'NotFound: Todo not found.'
                    content:
                        application/vnd.goa.error:
                            schema:
                                $ref: '#/components/schemas/Error'
                            example:
                                fault: false
                                id: 123abc
                                message: parameter 'p' must be an integer
                                name: NotFound
                                temporary: false
                                timeout: false
components:
    schemas:
        Error:
            type: object
            properties:
                fault:
                    type: boolean
                    description: Is the error a server-side fault?
                    example: false
                id:
                    type: string
                    description: ID is a unique identifier for this particular occurrence of the problem.
                    example: 123abc
                message:
                    type: string
                    description: Message is a human-readable explanation specific to this occurrence of the problem.
                    example: parameter 'p' must be an integer
                name:
                    type: string
                    description: Name is the name of this class of errors.
                    example: bad_request
                temporary:
                    type: boolean
                    description: Is the error temporary?
                    example: false
                timeout:
                    type: boolean
                    description: Is the error a timeout?
                    example: true
            description: Error response result type
            example:
                fault: false
                id: 123abc
                message: parameter 'p' must be an integer
                name: bad_request
                temporary: false
                timeout: true
            required:
                - name
                - id
                - message
                - temporary
                - timeout
                - fault
        Todo:
            type: object
            properties:
                completed:
                    type: boolean
                    description: Whether the task is completed or not
                    example: true
                id:
                    type: integer
                    description: Unique ID
                    example: 7672171696662812378
                    format: int64
                order:
                    type: integer
                    description: Order or priority of the task
                    example: 8457095650093581103
                    format: int64
                title:
                    type: string
                    description: Title of the task
                    example: Ex et voluptatibus.
                url:
                    type: string
                    example: Perferendis dicta.
            example:
                completed: true
                id: 7672171696662812378
                order: 8457095650093581103
                title: Ex et voluptatibus.
                url: Perferendis dicta.
            required:
                - id
                - url
        TodoPayload:
            type: object
            properties:
                completed:
                    type: boolean
                    description: Whether the task is completed or not
                    example: true
                order:
                    type: integer
                    description: Order or priority of the task
                    example: 6090170723161103845
                    format: int64
                title:
                    type: string
                    description: Title of the task
                    example: Blanditiis vitae magni laboriosam.
            description: Request body for create.
            example:
                completed: true
                order: 6090170723161103845
                title: Blanditiis vitae magni laboriosam.
        UpdateRequestBody:
            type: object
            properties:
                completed:
                    type: boolean
                    description: Whether the task is completed or not
                    example: false
                order:
                    type: integer
                    description: Order or priority of the task
                    example: 2016535712702321141
                    format: int64
                title:
                    type: string
                    description: Title of the task
                    example: Est impedit aut rerum.
            description: Request body for update.
            example:
                completed: false
                order: 2016535712702321141
                title: Est impedit aut rerum.
tags:
    - name: todos
    - name: probes
